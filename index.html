<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./src/output.css">
</head>
<body>
    
<header class="max-w-7xl mx-auto py-6 px-4 flex items-center justify-between">
  <!-- Логотип -->
  <div class="flex items-center gap-2">
    <img src="./imagespage1/Лого.png" alt="OkeyPost" class="h-8">
  </div>

  <!-- Навигация -->
  <nav class="lg:flex items-center gap-6 text-gray-600 font-medium hidden">
    <a href="#" class="hover:text-green-500">Как покупать</a>
    <a href="#" class="hover:text-green-500">Распродажи</a>
    <a href="#" class="hover:text-green-500">Цены</a>
    <a href="#" class="hover:text-green-500">Помощь</a>
    <a href="#" class="hover:text-green-500">Бонусы</a>
    <a href="#" class="hover:text-green-500">Блог</a>
    <a href="#" class="hover:text-green-500">Магазины</a>
  </nav>

  <!-- Вход и кнопка -->
  <div class="flex items-center gap-6">
    <a href="#" class="flex items-center gap-2 text-gray-800 font-medium">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      Вход
    </a>
    <button class="bg-green-500 hover:bg-green-600 text-white px-6 py-2 rounded-full font-medium transition hidden lg:flex">
      Связаться с нами
    </button>
  </div>
</header>

<section class="max-w-7xl mx-auto py-12 px-6">
  <div class="bg-gradient-to-r from-[#5B52A3] to-[#40B8EA] rounded-3xl p-10 md:p-16 flex flex-wrap items-center justify-between text-white">
    
    <!-- Текстовый блок -->
    <div class="w-full lg:w-1/2 mb-10 lg:mb-0">
      <h1 class="text-4xl md:text-5xl font-bold leading-tight mb-6">
        Доставка товаров из Великобритании в Россию
      </h1>
      <p class="text-lg opacity-90 mb-8 max-w-md">
        Начните экономить до 80% на шопинге. Регистрируйтесь в OkeyPost, чтобы покупать со скидками в UK одежду, обувь, гаджеты известных брендов и безопасно отправлять вещи в Россию.
      </p>
      <button class="bg-green-500 hover:bg-green-600 text-white font-medium px-8 py-4 rounded-full transition-colors">
        Получить адрес в UK
      </button>
    </div>

    <!-- Блок иллюстрации -->
    <div class="w-full lg:w-1/3 flex justify-center">
      <img src="./imagespage1/Иллюстрация.png" alt="OkeyPost Delivery" class="w-full max-w-sm">
    </div>

  </div>
</section>



</body>
</html>
